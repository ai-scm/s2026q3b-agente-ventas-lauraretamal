services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - .:/app
      - ${HOME}/.aws:/root/.aws:ro
    command: python -m services.launch
